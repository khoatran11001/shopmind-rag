[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopmind"
version = "0.1.0"
description = "Multimodal product retrieval foundation using Elasticsearch and SigLIP2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "elasticsearch>=8.15,<9.0",
  "transformers>=4.47,<5.0",
  "torch>=2.2,<3.0",
  "pillow>=10.4,<13.0",
  "numpy>=1.26,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "openai>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "httpx>=0.27,<1.0",
]
rag-rerank = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["shopmind*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require a real Elasticsearch service",
  "slow: tests that load large models or process non-trivial datasets",
]
